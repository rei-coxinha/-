<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0c0700">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./icone.png">
    <title>🍗 O Rei da Coxinha</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{width:100%;height:100%;overflow:hidden;background:#0a0600;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
        body{display:flex;align-items:center;justify-content:center}

        #splash{
            position:fixed;inset:0;
            display:flex;flex-direction:column;
            align-items:center;justify-content:center;
            background:radial-gradient(ellipse at 50% 40%, #1e0e00 0%, #0a0600 70%);
            transition:opacity 0.4s ease;
        }
        #splash.fade-out{opacity:0;pointer-events:none}

        /* Anel animado duplo */
        .rings{position:relative;width:80px;height:80px;margin-bottom:32px;}
        .ring-outer{
            position:absolute;inset:0;border-radius:50%;
            border:2px solid rgba(255,180,30,0.12);
            border-top-color:rgba(255,180,30,0.5);
            animation:spin 1.4s linear infinite;
        }
        .ring-inner{
            position:absolute;inset:12px;border-radius:50%;
            border:2px solid rgba(255,140,0,0.08);
            border-bottom-color:#f5a623;
            animation:spin 0.9s linear infinite reverse;
        }
        .ring-dot{
            position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
            font-size:26px;
            animation:pulse 2s ease-in-out infinite;
        }
        @keyframes spin{to{transform:rotate(360deg)}}
        @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

        /* Textos */
        .splash-title{
            font-size:22px;font-weight:800;
            color:#FFD700;letter-spacing:0.5px;
            text-shadow:0 0 20px rgba(255,200,0,0.2);
            margin-bottom:6px;
        }
        .splash-sub{
            font-size:12px;color:rgba(255,200,100,0.45);
            letter-spacing:1.5px;text-transform:uppercase;
            margin-bottom:40px;
        }
        .splash-status{
            font-size:12px;color:rgba(255,200,100,0.4);
            letter-spacing:0.5px;
            min-height:16px;
            animation:blink 1.8s ease-in-out infinite;
        }
        @keyframes blink{0%,100%{opacity:0.4}50%{opacity:0.8}}

        /* Botão de emergência — aparece após 6s */
        #btnClear{
            display:none;
            position:absolute;bottom:48px;left:50%;transform:translateX(-50%);
            background:none;border:1px solid rgba(255,80,80,0.25);
            border-radius:20px;padding:8px 20px;
            color:rgba(255,100,100,0.45);font-size:11px;
            cursor:pointer;letter-spacing:0.5px;
            -webkit-tap-highlight-color:transparent;
            transition:all 0.2s;
        }
        #btnClear:active{background:rgba(255,80,80,0.06);color:rgba(255,120,120,0.7);}
    </style>
</head>
<body>
<div id="splash">
    <div class="rings">
        <div class="ring-outer"></div>
        <div class="ring-inner"></div>
        <div class="ring-dot">🍗</div>
    </div>
    <div class="splash-title">Rei da Coxinha</div>
    <div class="splash-sub">O sabor é real</div>
    <div class="splash-status" id="splashStatus">Verificando...</div>
    <button id="btnClear" onclick="irParaClear()">Redefinir aplicativo</button>
</div>

<script>
(function(){
    var APP           = './card\u00e1pio.html';
    var status        = document.getElementById('splashStatus');
    var btnClear      = document.getElementById('btnClear');

    /* Mostra botão de emergência após 6 s */
    setTimeout(function(){ btnClear.style.display = 'block'; }, 6000);

    /* Ir para /clear */
    window.irParaClear = function(){
        window.location.replace('./clear');
    };

    /* ── Utilitários de rota ── */
    function caminhoAtual(){
        return window.location.pathname.replace(/\/+$/, '') || '/';
    }
    function isRotaClear(){
        var path = caminhoAtual();
        var search = window.location.search;
        var hash = window.location.hash;
        return /(?:^|[\/=])clear$/i.test(path) ||
               /[?&=]clear$/i.test(search) ||
               /[#=]clear$/i.test(hash);
    }
    function obterLoginEspecialDaRota(){
        var base = caminhoAtual().split('/').filter(Boolean).pop() || '';
        var m = base.match(/^(\d{8,15})=(.+)$/);
        if(!m) return null;
        return { telefone: m[1], nome: decodeURIComponent(m[2].replace(/\+/g, '%20')) };
    }

    /* ── Limpeza de emergência ── */
    async function limparTudoEmergencia(){
        document.body.innerHTML = '<main style="font-family:-apple-system,BlinkMacSystemFont,\'Segoe UI\',sans-serif;text-align:center;color:white;background:#0a0600;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px"><div><div style="width:56px;height:56px;border-radius:50%;border:2px solid rgba(255,180,30,0.2);border-top-color:#f5a623;animation:spin 0.9s linear infinite;margin:0 auto 28px"></div><style>@keyframes spin{to{transform:rotate(360deg)}}</style><div style="font-size:18px;font-weight:700;color:#fff;margin-bottom:10px;">Redefinindo o aplicativo</div><div style="font-size:13px;color:rgba(255,200,100,0.45);line-height:1.7;max-width:280px;margin:0 auto">Estamos limpando os dados locais e o cache do dispositivo.<br>O aplicativo será reiniciado em instantes.</div></div></main>';
        try{
            if('serviceWorker' in navigator){
                var regs = await navigator.serviceWorker.getRegistrations();
                await Promise.all(regs.map(async function(reg){
                    try{
                        if(reg.active) reg.active.postMessage({type:'CLEAR_ALL'});
                        else if(reg.waiting) reg.waiting.postMessage({type:'CLEAR_ALL'});
                    }catch(e){}
                }));
            }
            if('caches' in window){
                var keys = await caches.keys();
                await Promise.all(keys.map(function(k){ return caches.delete(k); }));
            }
            if('indexedDB' in window){
                await Promise.all(['rei-coxinha-push'].map(function(name){
                    return new Promise(function(resolve){
                        try{ var r=indexedDB.deleteDatabase(name); r.onsuccess=r.onerror=r.onblocked=resolve; }catch(e){ resolve(); }
                    });
                }));
            }
            try{ localStorage.clear(); }catch(e){}
            try{ sessionStorage.clear(); }catch(e){}
            try{
                document.cookie.split(';').forEach(function(c){
                    var eq=c.indexOf('=');
                    var name=(eq>=0?c.slice(0,eq):c).trim();
                    if(name) document.cookie=name+'=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/';
                });
            }catch(e){}
            if('serviceWorker' in navigator){
                var regs2 = await navigator.serviceWorker.getRegistrations();
                await Promise.all(regs2.map(function(r){ return r.unregister(); }));
            }
        }catch(e){}
        setTimeout(function(){ window.location.replace('./'); }, 900);
    }

    /* ── Destino com ?next= ── */
    function resolverDestino(){
        var next = new URLSearchParams(window.location.search).get('next');
        return next ? decodeURIComponent(next) : APP;
    }

    /* ── Redireciona com fade ── */
    function redirecionar(url){
        document.getElementById('splash').classList.add('fade-out');
        setTimeout(function(){ window.location.replace(url); }, 380);
    }

    /* ── ROTAS ESPECIAIS ── */
    if(isRotaClear()){
        limparTudoEmergencia();
        return;
    }

    var loginRota = obterLoginEspecialDaRota();
    if(loginRota){
        status.textContent = 'Entrando...';
        redirecionar('./card\u00e1pio.html?auto=' + encodeURIComponent(loginRota.telefone + '=' + loginRota.nome));
        return;
    }

    /* ── ROTEAMENTO PRINCIPAL ── */
    /* Redireciona imediatamente — sem delay.
       A animação só fica visível se o carregamento da próxima página demorar. */
    var standalone =
        window.matchMedia('(display-mode: standalone)').matches ||
        window.navigator.standalone === true;


    redirecionar(resolverDestino());

})();
</script>
</body>
</html>
