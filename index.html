<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#111827">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./icone.png">
    <title>🍗 O Rei da Coxinha</title>
    <style>
        *{box-sizing:border-box}
        html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b1020;color:#fff}
        body{display:flex;align-items:center;justify-content:center;overflow:hidden}
        .gate{width:min(430px,92vw);text-align:center;padding:30px 22px}
        .logo{width:112px;height:112px;border-radius:28px;object-fit:cover;box-shadow:0 12px 40px rgba(0,0,0,.5);margin-bottom:22px}
        h1{margin:0 0 10px;font-size:26px;font-weight:900}
        p{margin:0 auto 24px;color:rgba(255,255,255,.72);line-height:1.55;font-size:14px}
        .install{width:100%;padding:17px;border:0;border-radius:16px;background:linear-gradient(135deg,#1aad52,#25d366);color:#fff;font-size:16px;font-weight:900;box-shadow:0 8px 28px rgba(37,211,102,.28);cursor:pointer}
        .install:disabled{opacity:.55;cursor:default}
        .hint{margin-top:15px;font-size:12px;color:rgba(255,255,255,.48);line-height:1.5}
        .loading{display:none}
        .loading.active{display:block}
        .spinner{width:38px;height:38px;margin:0 auto 16px;border:4px solid rgba(255,255,255,.18);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
    </style>
</head>
<body>
    <main class="gate" id="installGate">
        <img class="logo" src="./icone.png" alt="O Rei da Coxinha">
        <h1>🍗 O Rei da Coxinha</h1>
        <p>Para continuar, instale o aplicativo na tela inicial.<br>Depois da instalação, o cardápio será aberto automaticamente.</p>
        <button class="install" id="installButton" disabled>📲 Preparando instalação...</button>
        <div class="hint" id="installHint">Aguarde enquanto o sistema prepara a instalação.</div>
    </main>

    <main class="gate loading" id="loadingGate">
        <div class="spinner"></div>
        <h1>🍗 Abrindo o aplicativo...</h1>
    </main>

<script>
(function(){
    var APP = './card\u00e1pio.html';
    var INSTALLED_KEY = 'pwa_instalado';

    var btn         = document.getElementById('installButton');
    var hint        = document.getElementById('installHint');
    var installGate = document.getElementById('installGate');
    var loadingGate = document.getElementById('loadingGate');
    var deferredPrompt = null;

    /* Resolve destino: usa ?next= se existir, senão abre o cardápio */
    function resolverDestino(){
        var params = new URLSearchParams(window.location.search);
        var next = params.get('next');
        if(next){
            // next já é um path/URL relativo codificado
            return decodeURIComponent(next);
        }
        return APP;
    }

    /* Abre o app imediatamente */
    function abrirApp(){
        loadingGate.classList.add('active');
        installGate.style.display = 'none';
        window.location.replace(resolverDestino());
    }

    /*
     * verificarInstalacao()
     * Verificação 100% síncrona e local — sem chamadas de rede.
     * Internet lenta não interfere: tudo vem do localStorage ou do
     * display-mode, que são imediatos.
     *
     * Só volta para a tela de instalação se NENHUMA das duas flags
     * confirmar que o app já foi instalado antes.
     */
    function verificarInstalacao(){
        /* 1. Modo standalone — rodando como PWA instalado agora */
        var standalone =
            window.matchMedia('(display-mode: standalone)').matches ||
            window.navigator.standalone === true;

        if(standalone){
            localStorage.setItem(INSTALLED_KEY, '1');
            abrirApp();
            return true;
        }

        /* 2. Flag local — instalado em sessão anterior */
        if(localStorage.getItem(INSTALLED_KEY) === '1'){
            abrirApp();
            return true;
        }

        /* Não instalado: mostra tela de instalação */
        return false;
    }

    /* Executa a verificação imediatamente */
    if(verificarInstalacao()) return;

    /* A partir daqui só chega se o app NÃO estiver instalado */

    if('serviceWorker' in navigator){
        navigator.serviceWorker.register('./SW-CLIENTE.js').catch(function(){});
    }

    window.addEventListener('beforeinstallprompt', function(e){
        e.preventDefault();
        deferredPrompt = e;
        btn.disabled = false;
        btn.textContent = '\uD83D\uDCF2 Instalar aplicativo';
        hint.textContent = 'A instala\u00e7\u00e3o \u00e9 necess\u00e1ria para continuar.';
    });

    btn.addEventListener('click', async function(){
        if(!deferredPrompt){
            hint.textContent = 'Se o bot\u00e3o de instala\u00e7\u00e3o n\u00e3o aparecer, abra o menu do navegador e escolha \u201cInstalar aplicativo\u201d ou \u201cAdicionar \u00e0 tela inicial\u201d.';
            return;
        }
        btn.disabled = true;
        deferredPrompt.prompt();
        var result = await deferredPrompt.userChoice;
        deferredPrompt = null;
        if(result.outcome === 'accepted'){
            hint.textContent = 'Instala\u00e7\u00e3o conclu\u00edda. Abrindo...';
        } else {
            btn.disabled = false;
            btn.textContent = '\uD83D\uDCF2 Instalar aplicativo';
            hint.textContent = 'Voc\u00ea precisa instalar o aplicativo para continuar.';
        }
    });

    window.addEventListener('appinstalled', function(){
        deferredPrompt = null;
        localStorage.setItem(INSTALLED_KEY, '1');
        setTimeout(abrirApp, 250);
    });

    /* Fallback: se beforeinstallprompt não disparar em 3 s */
    setTimeout(function(){
        if(!deferredPrompt && btn.disabled){
            btn.disabled = false;
            btn.textContent = '\uD83D\uDCF2 Instalar aplicativo';
            hint.textContent = 'Se a instala\u00e7\u00e3o n\u00e3o abrir automaticamente, use o menu do navegador para instalar o aplicativo.';
        }
    }, 3000);
})();
</script>
</body>
</html>
