<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#111827">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./icone.png">
    <title>🍗 O Rei da Coxinha</title>
    <style>
        *{box-sizing:border-box}
        html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b1020;color:#fff}
        body{display:flex;align-items:center;justify-content:center;overflow:hidden}
        .gate{width:min(430px,92vw);text-align:center;padding:30px 22px}
        .logo{width:112px;height:112px;border-radius:28px;object-fit:cover;box-shadow:0 12px 40px rgba(0,0,0,.5);margin-bottom:22px}
        h1{margin:0 0 10px;font-size:26px;font-weight:900}
        p{margin:0 auto 24px;color:rgba(255,255,255,.72);line-height:1.55;font-size:14px}
        .install{width:100%;padding:17px;border:0;border-radius:16px;background:linear-gradient(135deg,#1aad52,#25d366);color:#fff;font-size:16px;font-weight:900;box-shadow:0 8px 28px rgba(37,211,102,.28);cursor:pointer}
        .install:disabled{opacity:.55;cursor:default}
        .hint{margin-top:15px;font-size:12px;color:rgba(255,255,255,.48);line-height:1.5}
        .loading{display:none}
        .loading.active{display:block}
        .spinner{width:38px;height:38px;margin:0 auto 16px;border:4px solid rgba(255,255,255,.18);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
    </style>
</head>
<body>
    <main class="gate" id="installGate">
        <img class="logo" src="./icone.png" alt="O Rei da Coxinha">
        <h1>🍗 O Rei da Coxinha</h1>
        <p>Para continuar, instale o aplicativo na tela inicial.<br>Depois da instalação, o cardápio será aberto automaticamente.</p>
        <button class="install" id="installButton" disabled>📲 Preparando instalação...</button>
        <div class="hint" id="installHint">Aguarde enquanto o sistema prepara a instalação.</div>
    </main>

    <main class="gate loading" id="loadingGate">
        <div class="spinner"></div>
        <h1>🍗 Abrindo o aplicativo...</h1>
    </main>

<script>
(function(){
    var APP = './cardápio.html';
    var INSTALLED_KEY = 'pwa_instalado';

    /* ─────────────────────────────────────────────────────────────────
       NORMALIZA TELEFONE
       Pega os últimos 8 dígitos e forma "819" + 8 dígitos.
       ───────────────────────────────────────────────────────────────── */
    function normalizarTelefone(raw) {
        var digitos = raw.replace(/\D/g, '');
        if (digitos.length < 8) return null;
        var ultimos8 = digitos.slice(-8);
        return '819' + ultimos8;
    }

    /* ─────────────────────────────────────────────────────────────────
       DETECTA COMANDO NA URL
       Formatos tratados:
         /-/clear            → limpeza total
         /-/NUMERO=NOME      → login/cadastro automático
       ───────────────────────────────────────────────────────────────── */
    var caminho = window.location.pathname.replace(/\/+$/, '');

    /* ── COMANDO: /-/clear ──────────────────────────────────────────── */
    if (caminho === '/-/clear') {
        document.title = 'Limpando aplicativo...';
        limparTudoPWA().finally(function(){
            setTimeout(function(){
                window.location.replace('https://rei-coxinha.github.io/-/');
            }, 400);
        });
        return; // para a execução aqui
    }

    /* ── COMANDO: /-/NUMERO=NOME ────────────────────────────────────── */
    // Extrai o segmento após /-/
    var segmento = '';
    var matchSeg = caminho.match(/^\/-\/(.+)$/);
    if (matchSeg) segmento = matchSeg[1];

    var autoPhone = null;
    var autoName  = null;

    if (segmento && segmento.indexOf('=') !== -1) {
        var partes = segmento.split('=');
        var rawNum = partes[0].trim();
        var rawNom = partes.slice(1).join('=').trim(); // suporte a "=" no nome

        if (/^\d{8,}$/.test(rawNum) && rawNom.length > 0) {
            var phoneNorm = normalizarTelefone(rawNum);
            if (phoneNorm) {
                autoPhone = phoneNorm;
                autoName  = decodeURIComponent(rawNom);
            }
        }
    }

    /* ─────────────────────────────────────────────────────────────────
       LIMPEZA TOTAL PWA
       ───────────────────────────────────────────────────────────────── */
    async function limparTudoPWA() {
        var resultados = [];

        // 1) Storages da página
        try { localStorage.clear();  resultados.push('localStorage');  } catch(e) {}
        try { sessionStorage.clear(); resultados.push('sessionStorage'); } catch(e) {}

        // 2) Fecha notificações
        try {
            if ('serviceWorker' in navigator) {
                var regs = await navigator.serviceWorker.getRegistrations();
                for (var i = 0; i < regs.length; i++) {
                    try {
                        var notifs = await regs[i].getNotifications();
                        notifs.forEach(function(n){ try { n.close(); } catch(e){} });
                    } catch(e) {}
                }
            }
        } catch(e) {}

        // 3) Pede ao SW para apagar o que ele controla
        try {
            if ('serviceWorker' in navigator) {
                var regs2 = await navigator.serviceWorker.getRegistrations();
                for (var i = 0; i < regs2.length; i++) {
                    var reg = regs2[i];
                    if (reg.active) {
                        await new Promise(function(resolve){
                            var channel = new MessageChannel();
                            var done = false;
                            var finish = function(){ if(done) return; done=true; resolve(); };
                            channel.port1.onmessage = function(){ finish(); };
                            try {
                                reg.active.postMessage({ type: 'CLEAR_PWA_DATA' }, [channel.port2]);
                            } catch(e) { finish(); }
                            setTimeout(finish, 1500);
                        });
                    }
                }
                // 4) Desregistra os Service Workers
                for (var j = 0; j < regs2.length; j++) {
                    try { await regs2[j].unregister(); } catch(e) {}
                }
            }
        } catch(e) {}

        // 5) Apaga Cache Storage
        try {
            if ('caches' in window) {
                var keys = await caches.keys();
                await Promise.all(keys.map(function(key){ return caches.delete(key); }));
                resultados.push('cacheStorage');
            }
        } catch(e) {}

        // 6) Apaga IndexedDB
        try {
            if (window.indexedDB && indexedDB.databases) {
                var dbs = await indexedDB.databases();
                await Promise.all(dbs.map(function(db){
                    if (!db || !db.name) return Promise.resolve();
                    return new Promise(function(resolve){
                        var request;
                        try { request = indexedDB.deleteDatabase(db.name); } catch(e){ resolve(); return; }
                        request.onsuccess = request.onerror = request.onblocked = function(){ resolve(); };
                    });
                }));
                resultados.push('indexedDB');
            }
        } catch(e) {}

        // 7) Cookies JS
        try {
            document.cookie.split(';').forEach(function(cookie){
                var eq = cookie.indexOf('=');
                var name = (eq >= 0 ? cookie.slice(0, eq) : cookie).trim();
                if (name) {
                    document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/';
                    document.cookie = name + '=; Max-Age=0; path=/';
                }
            });
        } catch(e) {}

        return resultados;
    }

    /* ─────────────────────────────────────────────────────────────────
       DESTINO DO APP
       ───────────────────────────────────────────────────────────────── */
    function resolverDestino() {
        // Se veio de ?next=
        var params = new URLSearchParams(window.location.search);
        var next = params.get('next');
        if (next) return decodeURIComponent(next);

        // Se veio de URL especial /-/NUMERO=NOME, repassa para cardápio
        if (autoPhone && autoName) {
            return './cardápio.html?autoPhone=' +
                encodeURIComponent(autoPhone) +
                '&autoName=' +
                encodeURIComponent(autoName);
        }

        return APP;
    }

    /* Abre o app */
    function abrirApp() {
        var loadingGate = document.getElementById('loadingGate');
        var installGate = document.getElementById('installGate');
        if (loadingGate) loadingGate.classList.add('active');
        if (installGate) installGate.style.display = 'none';
        window.location.replace(resolverDestino());
    }

    /* ─────────────────────────────────────────────────────────────────
       VERIFICA INSTALAÇÃO
       ───────────────────────────────────────────────────────────────── */
    function verificarInstalacao() {
        var standalone =
            window.matchMedia('(display-mode: standalone)').matches ||
            window.navigator.standalone === true;

        if (standalone) {
            localStorage.setItem(INSTALLED_KEY, '1');
            abrirApp();
            return true;
        }

        if (localStorage.getItem(INSTALLED_KEY) === '1') {
            abrirApp();
            return true;
        }

        return false;
    }

    /* ─────────────────────────────────────────────────────────────────
       FLUXO PRINCIPAL
       ───────────────────────────────────────────────────────────────── */

    // Se há comando autoPhone/autoName e o app não está instalado no Android,
    // ainda assim abre o cardápio direto (sem exigir instalação para o comando de URL).
    // Para Android sem instalação + sem comando especial → exige instalação.
    var isAndroid = /Android/i.test(navigator.userAgent);

    // Não-Android: entra direto
    if (!isAndroid) {
        abrirApp();
        return;
    }

    // Android com comando de URL especial: abre direto (não bloqueia no install)
    if (autoPhone && autoName) {
        abrirApp();
        return;
    }

    // Android normal: verifica instalação
    if (verificarInstalacao()) return;

    /* ── A partir daqui: Android sem instalação, sem comando especial ── */

    var btn         = document.getElementById('installButton');
    var hint        = document.getElementById('installHint');
    var deferredPrompt = null;

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./SW-CLIENTE.js').catch(function(){});
    }

    window.addEventListener('beforeinstallprompt', function(e){
        e.preventDefault();
        deferredPrompt = e;
        btn.disabled = false;
        btn.textContent = '📲 Instalar aplicativo';
        hint.textContent = 'A instalação é necessária para continuar.';
    });

    btn.addEventListener('click', async function(){
        if (!deferredPrompt) {
            hint.textContent = 'Se o botão de instalação não aparecer, abra o menu do navegador e escolha "Instalar aplicativo" ou "Adicionar à tela inicial".';
            return;
        }
        btn.disabled = true;
        deferredPrompt.prompt();
        var result = await deferredPrompt.userChoice;
        deferredPrompt = null;
        if (result.outcome === 'accepted') {
            hint.textContent = 'Instalação concluída. Abrindo...';
        } else {
            btn.disabled = false;
            btn.textContent = '📲 Instalar aplicativo';
            hint.textContent = 'Você precisa instalar o aplicativo para continuar.';
        }
    });

    window.addEventListener('appinstalled', function(){
        deferredPrompt = null;
        localStorage.setItem(INSTALLED_KEY, '1');
        setTimeout(abrirApp, 250);
    });

    // Fallback: beforeinstallprompt não disparou em 3 s
    setTimeout(function(){
        if (!deferredPrompt && btn.disabled) {
            btn.disabled = false;
            btn.textContent = '📲 Instalar aplicativo';
            hint.textContent = 'Se a instalação não abrir automaticamente, use o menu do navegador para instalar o aplicativo.';
        }
    }, 3000);

})();
</script>
</body>
</html>
