<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔍 Diagnóstico Push — Rei da Coxinha</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0c0b0a; color:#eee; font-family:'Segoe UI',sans-serif; padding:16px; }
  h1 { font-size:18px; margin-bottom:16px; color:#f5a623; }
  h2 { font-size:13px; font-weight:700; color:#f5a623; margin:20px 0 8px; text-transform:uppercase; letter-spacing:1px; }

  .card { background:#1a1818; border-radius:14px; padding:14px; margin-bottom:10px; }
  .row { display:flex; justify-content:space-between; align-items:center; padding:7px 0; border-bottom:1px solid rgba(255,255,255,0.05); font-size:13px; }
  .row:last-child { border-bottom:none; }
  .label { color:rgba(255,255,255,0.5); flex-shrink:0; margin-right:8px; }
  .val { text-align:right; word-break:break-all; font-weight:600; max-width:70%; }
  .ok   { color:#25d366; }
  .err  { color:#e74c3c; }
  .warn { color:#f1c40f; }
  .info { color:#74b9ff; }

  button {
    width:100%; padding:14px; border:none; border-radius:12px;
    font-size:14px; font-weight:700; cursor:pointer; margin-bottom:10px;
    -webkit-tap-highlight-color:transparent;
  }
  .btn-primary { background:linear-gradient(135deg,#f5a623,#e07b00); color:#1a0800; }
  .btn-danger  { background:linear-gradient(135deg,#e74c3c,#c0392b); color:#fff; }
  .btn-info    { background:rgba(255,255,255,0.08); color:#eee; }

  #log {
    background:#111; border-radius:12px; padding:12px;
    font-family:monospace; font-size:11px; line-height:1.7;
    max-height:300px; overflow-y:auto; margin-top:10px;
    white-space:pre-wrap; word-break:break-all;
  }
  .log-ok   { color:#25d366; }
  .log-err  { color:#e74c3c; }
  .log-warn { color:#f1c40f; }
  .log-info { color:#74b9ff; }
  .log-sep  { color:rgba(255,255,255,0.2); }

  .spinner { display:inline-block; width:14px; height:14px; border:2px solid rgba(255,255,255,0.2); border-top-color:#f5a623; border-radius:50%; animation:spin .7s linear infinite; vertical-align:middle; margin-left:6px; }
  @keyframes spin { to { transform:rotate(360deg); } }

  #bancoRows { min-height:40px; }
  .db-row { background:rgba(255,255,255,0.04); border-radius:8px; padding:8px 10px; margin-bottom:6px; font-size:11px; font-family:monospace; word-break:break-all; line-height:1.6; }
  .db-match { border-left:3px solid #25d366; }
  .db-other { border-left:3px solid rgba(255,255,255,0.15); }
</style>
</head>
<body>

<h1>🔍 Diagnóstico Push</h1>

<h2>1. Estado do Browser</h2>
<div class="card" id="browserCard">
  <div class="row"><span class="label">Notificação permissão</span><span class="val" id="permVal">—</span></div>
  <div class="row"><span class="label">ServiceWorker</span><span class="val" id="swVal">—</span></div>
  <div class="row"><span class="label">PushManager</span><span class="val" id="pmVal">—</span></div>
  <div class="row"><span class="label">Subscription no browser</span><span class="val" id="subVal">—</span></div>
  <div class="row"><span class="label">Endpoint (últimos 40)</span><span class="val" id="endpVal">—</span></div>
  <div class="row"><span class="label">Device ID local</span><span class="val" id="devVal">—</span></div>
  <div class="row"><span class="label">Phone salvo</span><span class="val" id="phoneVal">—</span></div>
</div>

<h2>2. Banco (web_push_subscriptions)</h2>
<div class="card">
  <div id="bancoRows"><span style="color:rgba(255,255,255,0.3);font-size:12px">Clique em "Verificar banco" abaixo</span></div>
</div>

<h2>3. Ações</h2>
<button class="btn-primary" onclick="rodarDiagnostico()">🔄 Verificar tudo agora</button>
<button class="btn-info"    onclick="simularSaidaEntrada()">🔁 Simular sair → entrar</button>
<button class="btn-danger"  onclick="forcarNova()">💥 Forçar subscription nova</button>
<button class="btn-info"    onclick="limparLog()">🗑️ Limpar log</button>

<h2>4. Log em tempo real</h2>
<div id="log"></div>

<script>
// ── CONFIG ──────────────────────────────────────────────────────────────────
const SUPABASE_URL    = 'https://vpeyqgijajywgswmezlh.supabase.co';
const SUPABASE_KEY    = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZwZXlxZ2lqYWp5d2dzd21lemxoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEyNTM1MDIsImV4cCI6MjA4NjgyOTUwMn0.LA5Cbof7IKWAA7l8YbCuPzANpCy0rX_Dro4l9fcDgoQ';
const VAPID_PUBLIC_KEY = 'BIlEWyrcCIfvM2Sj8fIJTOPaUhx5V7m52BRCHykFVinWJaKylTPfUiqSap1mY2NfdPcrn8MNquBqk-CTRZGh7a8';
const SW_URL           = './SW-CLIENTE.js';
const DEVICE_CHAVE     = 'rei_coxinha_push_device_id';

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ── LOG ──────────────────────────────────────────────────────────────────────
function log(msg, tipo='info') {
  const el = document.getElementById('log');
  const ts  = new Date().toLocaleTimeString('pt-BR');
  const cls = {ok:'log-ok', err:'log-err', warn:'log-warn', info:'log-info', sep:'log-sep'}[tipo] || 'log-info';
  el.innerHTML += `<span class="${cls}">[${ts}] ${msg}</span>\n`;
  el.scrollTop = el.scrollHeight;
}
function sep(t) { log('─── ' + t + ' ───────────────────────', 'sep'); }
function limparLog() { document.getElementById('log').innerHTML = ''; }

// ── HELPERS ──────────────────────────────────────────────────────────────────
function urlBase64ToUint8Array(b) {
  const pad  = '='.repeat((4 - b.length % 4) % 4);
  const base = (b + pad).replace(/-/g,'+').replace(/_/g,'/');
  const raw  = atob(base);
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}

function obterDeviceId() {
  let id = localStorage.getItem(DEVICE_CHAVE);
  if (!id) {
    id = window.crypto?.randomUUID?.() || 'device-' + Date.now() + '-' + Math.random().toString(36).slice(2);
    localStorage.setItem(DEVICE_CHAVE, id);
  }
  return id;
}

function setVal(id, txt, cls) {
  const el = document.getElementById(id);
  el.textContent = txt;
  el.className = 'val ' + (cls || '');
}

// ── DIAGNÓSTICO PRINCIPAL ────────────────────────────────────────────────────
async function rodarDiagnostico() {
  sep('DIAGNÓSTICO COMPLETO');

  // Permissão
  const perm = Notification.permission;
  setVal('permVal', perm, perm === 'granted' ? 'ok' : perm === 'denied' ? 'err' : 'warn');
  log(`Permissão: ${perm}`, perm === 'granted' ? 'ok' : perm === 'denied' ? 'err' : 'warn');

  // ServiceWorker
  const temSW = 'serviceWorker' in navigator;
  setVal('swVal', temSW ? 'suportado' : 'NÃO suportado', temSW ? 'ok' : 'err');
  log('ServiceWorker: ' + (temSW ? 'suportado' : 'NÃO suportado'), temSW ? 'ok' : 'err');

  // PushManager
  const temPM = 'PushManager' in window;
  setVal('pmVal', temPM ? 'suportado' : 'NÃO suportado', temPM ? 'ok' : 'err');
  log('PushManager: ' + (temPM ? 'suportado' : 'NÃO suportado'), temPM ? 'ok' : 'err');

  // Device ID
  const devId = obterDeviceId();
  setVal('devVal', devId.slice(0, 36), 'info');
  log('Device ID: ' + devId, 'info');

  // Phone
  const phone = localStorage.getItem('rei_phone') || '(não salvo)';
  setVal('phoneVal', phone, phone !== '(não salvo)' ? 'ok' : 'warn');
  log('Phone salvo: ' + phone, phone !== '(não salvo)' ? 'ok' : 'warn');

  // Subscription no browser
  if (temSW && temPM) {
    try {
      const reg = await navigator.serviceWorker.getRegistration();
      if (!reg) {
        setVal('subVal', 'SW não registrado', 'err');
        setVal('endpVal', '—', 'err');
        log('SW não registrado neste escopo!', 'err');
        log('  ↳ Causa provável: o cardápio.html estava em outro domínio/pasta que o SW-CLIENTE.js', 'warn');
      } else {
        log('SW registrado: ' + reg.scope, 'ok');
        const sub = await reg.pushManager.getSubscription();
        if (sub) {
          const subJ = sub.toJSON();
          setVal('subVal', 'ATIVA ✅', 'ok');
          setVal('endpVal', subJ.endpoint.slice(-40), 'ok');
          log('Subscription ativa no browser', 'ok');
          log('  Endpoint: ...' + subJ.endpoint.slice(-60), 'info');
          log('  p256dh: ' + (subJ.keys?.p256dh ? 'presente' : 'AUSENTE'), subJ.keys?.p256dh ? 'ok' : 'err');
          log('  auth: '   + (subJ.keys?.auth   ? 'presente' : 'AUSENTE'), subJ.keys?.auth   ? 'ok' : 'err');

          // Compara endpoint com o banco
          await verificarBanco(devId, phone, subJ.endpoint);
        } else {
          setVal('subVal', 'NENHUMA ❌', 'err');
          setVal('endpVal', '—', 'err');
          log('Nenhuma subscription no browser!', 'err');
          log('  ↳ O browser fez unsubscribe em algum momento (logout anterior, cache, VAPID errado)', 'warn');
          await verificarBanco(devId, phone, null);
        }
      }
    } catch(e) {
      log('Erro ao checar SW/subscription: ' + e.message, 'err');
    }
  }
}

// ── BANCO ────────────────────────────────────────────────────────────────────
async function verificarBanco(devId, phone, endpointBrowser) {
  sep('BANCO');
  const cont = document.getElementById('bancoRows');
  cont.innerHTML = '<span style="color:rgba(255,255,255,0.4);font-size:12px">Buscando<span class="spinner"></span></span>';

  try {
    // Busca por device_id
    const { data: porDevice, error: e1 } = await sb
      .from('web_push_subscriptions')
      .select('*')
      .eq('device_id', devId);

    // Busca por phone
    const { data: porPhone, error: e2 } = await sb
      .from('web_push_subscriptions')
      .select('*')
      .eq('phone', phone);

    if (e1 || e2) {
      cont.innerHTML = '<span class="err">Erro ao buscar: ' + (e1?.message || e2?.message) + '</span>';
      log('Erro banco: ' + (e1?.message || e2?.message), 'err');
      return;
    }

    const todos = [...(porDevice || []), ...(porPhone || [])];
    const unique = [...new Map(todos.map(r => [r.id || r.endpoint, r])).values()];

    cont.innerHTML = '';

    if (!unique.length) {
      cont.innerHTML = '<div class="db-row" style="color:#e74c3c">Nenhum registro no banco para este device ou phone</div>';
      log('Banco: NENHUM registro encontrado!', 'err');
      log('  ↳ A subscription nunca foi salva, ou foi deletada no logout', 'warn');
      return;
    }

    log(`Banco: ${unique.length} registro(s) encontrado(s)`, unique.length ? 'ok' : 'warn');

    unique.forEach(r => {
      const isDevice   = r.device_id === devId;
      const isPhone    = r.phone === phone;
      const endpMatch  = endpointBrowser && r.endpoint === endpointBrowser;

      const cls = (isDevice && isPhone) ? 'db-match' : 'db-other';
      cont.innerHTML += `
        <div class="db-row ${cls}">
          <b style="color:${isDevice&&isPhone?'#25d366':'#f1c40f'}">${isDevice&&isPhone?'✅ Este device+phone':'⚠️ Outro registro'}</b><br>
          phone: ${r.phone || '—'}<br>
          device_id: ${(r.device_id||'—').slice(0,36)}<br>
          destinatario: ${r.destinatario || '—'}<br>
          endpoint: ...${(r.endpoint||'').slice(-50)}<br>
          endpoint == browser: <b style="color:${endpMatch?'#25d366':'#e74c3c'}">${endpointBrowser ? (endpMatch?'SIM ✅':'NÃO ❌') : 'sem sub no browser'}</b>
        </div>`;

      if (isDevice && isPhone && !endpMatch && endpointBrowser) {
        log('  ⚠️ Endpoint no banco DIFERENTE do browser — push vai falhar!', 'err');
        log('    Banco:   ...' + r.endpoint.slice(-50), 'warn');
        log('    Browser: ...' + endpointBrowser.slice(-50), 'warn');
        log('  ↳ Causa: logout fez unsubscribe, browser gerou endpoint novo mas banco ficou velho', 'err');
      }
      if (isDevice && isPhone && endpMatch) {
        log('  Endpoint banco == browser ✅', 'ok');
      }
      if (!isDevice || !isPhone) {
        log(`  Registro órfão — phone:${r.phone} device:${(r.device_id||'').slice(0,18)}...`, 'warn');
      }
    });

  } catch(e) {
    cont.innerHTML = '<span class="err">Exceção: ' + e.message + '</span>';
    log('Exceção banco: ' + e.message, 'err');
  }
}

// ── SIMULAR SAIR → ENTRAR ────────────────────────────────────────────────────
async function simularSaidaEntrada() {
  sep('SIMULAR LOGOUT → LOGIN');

  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    log('Push não suportado — abortando.', 'err'); return;
  }

  const devId = obterDeviceId();
  const phone = localStorage.getItem('rei_phone') || 'teste-diagnostico';

  // Estado antes
  log('--- ANTES DO LOGOUT ---', 'info');
  const regAntes = await navigator.serviceWorker.getRegistration().catch(() => null);
  const subAntes = regAntes ? await regAntes.pushManager.getSubscription().catch(() => null) : null;
  log('Subscription antes: ' + (subAntes ? subAntes.endpoint.slice(-40) : 'NENHUMA'), subAntes ? 'ok' : 'err');

  // Simula o que o logout ANTIGO fazia (unsubscribe)
  log('--- LOGOUT (simulando unsubscribe) ---', 'warn');
  if (subAntes) {
    await subAntes.unsubscribe();
    log('unsubscribe() executado', 'warn');
  } else {
    log('Não tinha sub para fazer unsubscribe', 'warn');
  }

  // Verifica depois do "logout"
  const subDepoisLogout = regAntes ? await regAntes.pushManager.getSubscription().catch(() => null) : null;
  log('Sub após logout: ' + (subDepoisLogout ? 'ainda existe (inesperado)' : 'REMOVIDA'), subDepoisLogout ? 'warn' : 'info');

  // Simula login — tenta reativar
  log('--- LOGIN (tentando reativar) ---', 'info');
  try {
    const reg = await navigator.serviceWorker.register(SW_URL, { updateViaCache:'none' });
    await navigator.serviceWorker.ready;

    let sub = await reg.pushManager.getSubscription();
    if (sub) {
      log('Browser ainda tem sub (boa sorte): ' + sub.endpoint.slice(-40), 'ok');
    } else {
      log('Sem sub no browser — tentando subscribe()...', 'warn');
      try {
        sub = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
        });
        log('Nova subscription criada: ' + sub.endpoint.slice(-40), 'ok');
      } catch(e) {
        log('FALHOU ao criar subscription: ' + e.message, 'err');
        log('  ↳ Isso explica por que para de chegar notificação!', 'err');
        log('  Motivo comum: permissão revogada internamente, VAPID inválido ou SW com erro', 'warn');
      }
    }
  } catch(e) {
    log('Erro no login simulado: ' + e.message, 'err');
  }

  sep('FIM DA SIMULAÇÃO');
  log('Rodando diagnóstico completo...', 'info');
  await rodarDiagnostico();
}

// ── FORÇAR NOVA ──────────────────────────────────────────────────────────────
async function forcarNova() {
  sep('FORÇAR NOVA SUBSCRIPTION');
  const devId = obterDeviceId();
  const phone = localStorage.getItem('rei_phone');
  if (!phone) { log('Nenhum phone no localStorage — faça login no cardápio primeiro', 'err'); return; }

  try {
    const reg = await navigator.serviceWorker.register(SW_URL, { updateViaCache:'none' });
    await navigator.serviceWorker.ready;

    const antiga = await reg.pushManager.getSubscription();
    if (antiga) { await antiga.unsubscribe(); log('Sub antiga removida', 'warn'); }

    const nova = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
    });
    log('Nova sub criada: ...' + nova.endpoint.slice(-40), 'ok');

    const subJ = nova.toJSON();
    const { error } = await sb.from('web_push_subscriptions').upsert({
      device_id: devId,
      destinatario: 'cliente',
      endpoint: subJ.endpoint,
      p256dh: subJ.keys.p256dh,
      auth: subJ.keys.auth,
      phone: String(phone)
    }, { onConflict: 'device_id,destinatario' });

    if (error) { log('Erro ao salvar no banco: ' + error.message, 'err'); }
    else        { log('Banco atualizado com nova subscription ✅', 'ok'); }

    await rodarDiagnostico();
  } catch(e) {
    log('Erro ao forçar nova: ' + e.message, 'err');
    if (e.message.includes('permission')) log('  ↳ Permissão de notificação bloqueada no browser', 'err');
  }
}

// Roda ao abrir
window.addEventListener('load', rodarDiagnostico);
</script>
</body>
</html>
