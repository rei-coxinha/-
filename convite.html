<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0b0a">
<title>🎁 Convites - Rei da Coxinha</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;background:#0c0b0a;color:#fff;font-family:Arial,Helvetica,sans-serif;padding:18px 14px 40px}.wrap{max-width:520px;margin:auto}.top{display:flex;align-items:center;gap:10px;margin-bottom:18px}.back{width:44px;height:44px;border:1px solid rgba(255,255,255,.1);border-radius:14px;background:rgba(255,255,255,.06);color:#fff;font-size:25px;cursor:pointer}.title{flex:1}.title h1{font-size:21px;font-weight:900}.title p{font-size:12px;color:rgba(255,255,255,.5);margin-top:3px}.hero{border:1px solid rgba(37,211,102,.2);border-radius:24px;padding:24px 20px;text-align:center;background:linear-gradient(145deg,rgba(37,211,102,.14),rgba(241,196,15,.06));margin-bottom:12px}.hero .emoji{font-size:50px;margin-bottom:8px}.hero h2{font-size:22px;font-weight:900;margin-bottom:7px}.hero p{font-size:13px;color:rgba(255,255,255,.62);line-height:1.55}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.stat{background:#171515;border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:18px;text-align:center}.num{font-size:30px;font-weight:900}.lbl{font-size:10px;color:rgba(255,255,255,.5);font-weight:800;text-transform:uppercase;margin-top:4px;letter-spacing:.5px}.card{background:#171515;border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:17px;margin-bottom:12px}.ct{font-size:14px;font-weight:900;margin-bottom:11px}.link{display:flex;gap:7px}.input{min-width:0;flex:1;background:#0d0c0c;border:1px solid rgba(255,255,255,.1);border-radius:13px;color:#fff;padding:12px;font-size:11px;outline:none}.btn{border:0;border-radius:13px;padding:12px 14px;font-weight:900;cursor:pointer}.share-row{display:flex;gap:8px;align-items:stretch}.copy-mini{flex:0 0 44px;width:44px;background:#fff;color:#111;font-size:16px;padding:0;display:grid;place-items:center}.wa-big{flex:1;background:#25d366;color:#fff;font-size:15px;padding:16px 10px}.reward{display:flex;align-items:center;gap:12px;padding:14px;border-radius:15px;background:rgba(241,196,15,.06);border:1px solid rgba(241,196,15,.15)}.reward-icon{font-size:30px}.reward strong{display:block;font-size:14px}.reward span{display:block;font-size:11px;color:rgba(255,255,255,.5);margin-top:3px}.friend{display:flex;align-items:center;gap:11px;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.06)}.friend:last-child{border-bottom:0}.avatar{width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.06);display:grid;place-items:center;font-size:19px}.fi{flex:1}.fn{font-size:14px;font-weight:800}.fd{font-size:10px;color:rgba(255,255,255,.45);margin-top:3px}.status{font-size:9px;font-weight:900;padding:6px 8px;border-radius:8px;background:rgba(37,211,102,.1);color:#25d366}.status.pending{color:#f1c40f;background:rgba(241,196,15,.09)}.empty,.loading{text-align:center;color:rgba(255,255,255,.5);font-size:12px;line-height:1.55;padding:22px 8px}.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#fff;color:#111;border-radius:14px;padding:12px 17px;font-size:12px;font-weight:900;transition:.25s;z-index:99;max-width:90vw;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><button class="back" onclick="window.location.href='cardapio.html'">‹</button><div class="title"><h1>🎁 Convide seus amigos!</h1><p>Seu amigo ganha 10 coxinhas grátis<br>Quando ele voltar para fazer o segundo pedido, você ganha 10 coxinhas</p></div></div>
<div class="stats"><div class="stat"><div class="num" id="saldo">0</div><div class="lbl">Coxinhas grátis</div></div><div class="stat"><div class="num" id="ativos">0</div><div class="lbl">Convites ativos</div></div></div>
<div class="card"><div class="ct">🔗 Convide seus amigos</div><div class="share-row"><button class="btn copy-mini" onclick="copiar()" title="Copiar link">📋</button><button class="btn wa-big" onclick="whatsapp()">💬 Compartilhar no WhatsApp</button></div></div>
<div class="card"><div class="ct">👥 Amigos indicados</div><div id="lista"><div class="loading">Carregando...</div></div></div>
</div>
<div id="toast" class="toast"></div>
<script>
const SUPABASE_URL="https://vpeyqgijajywgswmezlh.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZwZXlxZ2lqYWp5d2dzd21lemxoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEyNTM1MDIsImV4cCI6MjA4NjgyOTUwMn0.LA5Cbof7IKWAA7l8YbCuPzANpCy0rX_Dro4l9fcDgoQ";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
function phone(){return String(localStorage.getItem('rei_phone')||'').replace(/\D/g,'')}
function getUser(){try{return JSON.parse(localStorage.getItem('rei_user')||'null')}catch(e){return null}}
function esc(v){return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window._toast);window._toast=setTimeout(()=>t.classList.remove('show'),2800)}
function nome(){const u=getUser();return u?.name||u?.nome||'Amigo'}
function link(){const p=phone();if(!p)return '';return 'https://rei-coxinha.github.io/-/cardapio.html?auto='+encodeURIComponent(p)+'='+encodeURIComponent(nome())}
async function copiar(){const u=link();if(!u){toast('Faça login para gerar seu link');return}try{await navigator.clipboard.writeText(u)}catch(e){const i=document.createElement('textarea');i.value=u;i.style.position='fixed';i.style.opacity='0';document.body.appendChild(i);i.select();document.execCommand('copy');document.body.removeChild(i)}toast('✅ Link copiado!')}
function whatsapp(){const u=link();if(!u){toast('Faça login para gerar seu link');return}const msg=`🎁 Convite VIP para Revenda!\n\nO ${nome()} liberou 10 coxinhas grátis para você provar a qualidade dos produtos do Rei da Coxinha. 🍗✨\n\n🛑 Exclusivo para novos revendedores.\nGaranta o seu cadastro no link:\n👇\n➖➖➖➖➖➖➖➖➖\n${u}\n➖➖➖➖➖➖➖➖➖`;window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank')}
function statusText(s){if(s==='concluida')return '✓ CONCLUÍDA';if(s==='primeiro_pedido')return '1º PEDIDO';return 'PENDENTE'}
function statusClass(s){return s==='concluida'?'':'pending'}
async function carregar(){const p=phone();if(!p){document.getElementById('lista').innerHTML='<div class="empty">Faça login no cardápio para ver seus convites.</div>';return}const {data:client,error:e1}=await sb.from('clientes').select('phone,name,coxinhas_gratis').eq('phone',p).maybeSingle();if(e1||!client){document.getElementById('lista').innerHTML='<div class="empty">Não foi possível carregar seus dados.</div>';return}const saldo=Number(client.coxinhas_gratis||0);document.getElementById('saldo').textContent=saldo;const {data:list,error:e2}=await sb.rpc('listar_indicacoes_cliente',{p_indicador_phone:p});if(e2){console.error(e2);document.getElementById('lista').innerHTML='<div class="empty">Não foi possível carregar suas indicações.</div>';return}const arr=list||[];document.getElementById('ativos').textContent=arr.filter(x=>x.status!=='concluida').length;if(!arr.length){document.getElementById('lista').innerHTML='<div class="empty">Você ainda não indicou ninguém.<br>Compartilhe seu link para começar.</div>';return}document.getElementById('lista').innerHTML=arr.map(x=>`<div class="friend"><div class="avatar">👤</div><div class="fi"><div class="fn">${esc(x.indicado_nome||'Amigo')}</div><div class="fd">${x.created_at?new Date(x.created_at).toLocaleDateString('pt-BR'):''}</div></div><div class="status ${statusClass(x.status)}">${statusText(x.status)}</div></div>`).join('')}
document.addEventListener('DOMContentLoaded',carregar);
</script>
</body>
</html>
