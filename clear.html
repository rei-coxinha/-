<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0c0700">
    <title>🍗 Redefinindo — O Rei da Coxinha</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{width:100%;height:100%;overflow:hidden;background:#0a0600;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
        body{display:flex;align-items:center;justify-content:center}

        main{
            text-align:center;color:white;min-height:100vh;
            display:flex;align-items:center;justify-content:center;padding:32px;
        }

        .container{
            max-width:280px;
        }

        .spinner{
            width:56px;height:56px;border-radius:50%;
            border:2px solid rgba(255,180,30,0.2);
            border-top-color:#f5a623;
            animation:spin 0.9s linear infinite;
            margin:0 auto 28px;
        }

        .title{
            font-size:18px;font-weight:700;
            margin-bottom:10px;color:#fff;
        }

        .message{
            font-size:13px;color:rgba(255,200,100,0.45);
            line-height:1.7;margin:0 auto;
        }

        .emoji{
            font-size:48px;margin-bottom:16px;
            animation:bounce 1.4s ease-in-out infinite;
        }

        @keyframes spin{
            to{transform:rotate(360deg)}
        }

        @keyframes bounce{
            0%,100%{transform:translateY(0)}
            50%{transform:translateY(-8px)}
        }
    </style>
</head>
<body>
<main>
    <div class="container">
        <div class="emoji">🧹</div>
        <div class="spinner"></div>
        <div class="title">Redefinindo o aplicativo</div>
        <div class="message">Estamos limpando os dados locais e o cache do dispositivo.<br>O aplicativo será reiniciado em instantes.</div>
    </div>
</main>

<script>
(async function(){
    try{
        /* Notificar Service Workers */
        if('serviceWorker' in navigator){
            var regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map(async function(reg){
                try{
                    if(reg.active) reg.active.postMessage({type:'CLEAR_ALL'});
                    else if(reg.waiting) reg.waiting.postMessage({type:'CLEAR_ALL'});
                }catch(e){}
            }));
        }

        /* Limpar Cache Storage */
        if('caches' in window){
            var keys = await caches.keys();
            await Promise.all(keys.map(function(k){ return caches.delete(k); }));
        }

        /* Limpar IndexedDB */
        if('indexedDB' in window){
            await Promise.all(['rei-coxinha-push'].map(function(name){
                return new Promise(function(resolve){
                    try{
                        var r = indexedDB.deleteDatabase(name);
                        r.onsuccess = r.onerror = r.onblocked = resolve;
                    }catch(e){ resolve(); }
                });
            }));
        }

        /* Limpar Storage Local */
        try{ localStorage.clear(); }catch(e){}
        try{ sessionStorage.clear(); }catch(e){}

        /* Limpar Cookies */
        try{
            document.cookie.split(';').forEach(function(c){
                var eq = c.indexOf('=');
                var name = (eq >= 0 ? c.slice(0, eq) : c).trim();
                if(name) document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/';
            });
        }catch(e){}

        /* Desregistrar Service Workers */
        if('serviceWorker' in navigator){
            var regs2 = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs2.map(function(r){ return r.unregister(); }));
        }
    }catch(e){}

    /* Redirecionar para home após conclusão */
    setTimeout(function(){ window.location.replace('./'); }, 1000);
})();
</script>
</body>
</html>
