<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0c0700">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./fotos/icone.png">
    <title>🍗 O Rei da Coxinha</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{width:100%;height:100%;overflow:hidden;background:#0a0600;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
        body{display:flex;align-items:center;justify-content:center}

        #splash{
            position:fixed;inset:0;
            display:flex;flex-direction:column;
            align-items:center;justify-content:center;
            background:radial-gradient(ellipse at 50% 40%, #1e0e00 0%, #0a0600 70%);
            transition:opacity 0.4s ease;
            padding:24px;text-align:center;
        }
        #splash.fade-out{opacity:0;pointer-events:none}

        .rings{position:relative;width:80px;height:80px;margin-bottom:32px;}
        .ring-outer{
            position:absolute;inset:0;border-radius:50%;
            border:2px solid rgba(255,180,30,0.12);
            border-top-color:rgba(255,180,30,0.5);
            animation:spin 1.4s linear infinite;
        }
        .ring-inner{
            position:absolute;inset:12px;border-radius:50%;
            border:2px solid rgba(255,140,0,0.08);
            border-bottom-color:#f5a623;
            animation:spin 0.9s linear infinite reverse;
        }
        .ring-dot{
            position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
            font-size:26px;
            animation:pulse 2s ease-in-out infinite;
        }
        @keyframes spin{to{transform:rotate(360deg)}}
        @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

        .splash-title{
            font-size:22px;font-weight:800;
            color:#FFD700;letter-spacing:0.5px;
            text-shadow:0 0 20px rgba(255,200,0,0.2);
            margin-bottom:6px;
        }
        .splash-sub{
            font-size:12px;color:rgba(255,200,100,0.45);
            letter-spacing:1.5px;text-transform:uppercase;
            margin-bottom:40px;
        }
        .splash-status{
            font-size:12px;color:rgba(255,200,100,0.4);
            letter-spacing:0.5px;
            min-height:16px;
            animation:blink 1.8s ease-in-out infinite;
        }
        @keyframes blink{0%,100%{opacity:0.4}50%{opacity:0.8}}

        #btnManual{
            display:none;
            margin-top:28px;
            background:linear-gradient(145deg,#ff8c00,#ff6a00);
            border:none;border-radius:20px;padding:12px 26px;
            color:#1a0d00;font-size:13px;font-weight:800;
            cursor:pointer;letter-spacing:0.3px;
            -webkit-tap-highlight-color:transparent;
            box-shadow:0 8px 20px rgba(255,120,0,0.25);
        }
    </style>
</head>
<body>
<div id="splash">
    <div class="rings">
        <div class="ring-outer"></div>
        <div class="ring-inner"></div>
        <div class="ring-dot">🍗</div>
    </div>
    <div class="splash-title">Rei da Coxinha</div>
    <div class="splash-sub">O sabor é real</div>
    <div class="splash-status" id="splashStatus">Verificando link...</div>
    <button id="btnManual" onclick="window.location.replace('./cardapio.html')">Entrar manualmente</button>
</div>

<script>
(function(){
    var status    = document.getElementById('splashStatus');
    var btnManual = document.getElementById('btnManual');

    /* ── Extrai telefone=nome do link, aceitando os formatos:
       ?=81996603348=Jefferson   (chave vazia — formato padrão deste link)
       ?auto=81996603348=Jefferson
       /81996603348=Jefferson    (segmento de rota, como fallback) ── */
    function obterDadosDoLink(){
        var params = new URLSearchParams(window.location.search);
        var raw = params.get('') || params.get('auto');

        if(!raw){
            var qs = window.location.search.replace(/^\?/, '');
            if(qs.indexOf('=') === 0) raw = decodeURIComponent(qs.slice(1));
        }

        if(!raw){
            var seg = window.location.pathname.replace(/\/+$/, '').split('/').filter(Boolean).pop() || '';
            var m = seg.match(/^(\d{8,15})=(.+)$/);
            if(m) raw = m[1] + '=' + decodeURIComponent(m[2].replace(/\+/g, '%20'));
        }

        if(!raw) return null;
        var pos = raw.indexOf('=');
        if(pos < 1) return null;
        var telefone = raw.slice(0, pos).replace(/\D/g, '');
        var nome = raw.slice(pos + 1).trim();
        if(!telefone || !nome) return null;
        return { telefone: telefone, nome: nome };
    }

    function redirecionar(url){
        document.getElementById('splash').classList.add('fade-out');
        setTimeout(function(){ window.location.replace(url); }, 380);
    }

    var dados = obterDadosDoLink();

    if(!dados){
        status.textContent = 'Link inválido ou incompleto';
        btnManual.style.display = 'inline-block';
        return;
    }

    /* A lógica de cadastrar/entrar/trocar de conta já existe no cardapio.html
       (função auth() + obterLoginEspecial()): se o telefone já tem cadastro, entra;
       se não tem, cria; se o aparelho estava logado em outra conta, essa é substituída
       pela do link. Aqui só repassamos os dados no mesmo formato que ele espera. */
    status.textContent = 'Entrando, ' + dados.nome.split(' ')[0] + '...';
    redirecionar('./cardapio.html?auto=' + encodeURIComponent(dados.telefone + '=' + dados.nome));

})();
</script>
</body>
</html>
