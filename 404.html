<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080808">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icone.png">
<link rel="apple-touch-icon" href="./icone.png">
<title>O Rei da Coxinha</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;font-family:Inter,Arial,sans-serif;background:#050505;color:#fff}body{min-height:100vh;display:grid;place-items:center;overflow:hidden;padding:18px}.bg{position:fixed;inset:0;background:radial-gradient(circle at 50% 25%,rgba(255,193,7,.14),transparent 32%),radial-gradient(circle at 50% 85%,rgba(255,132,0,.09),transparent 38%)}.orb{position:fixed;width:260px;height:260px;border-radius:50%;border:1px solid rgba(255,193,7,.10);animation:orb 7s ease-in-out infinite;pointer-events:none}.orb:before,.orb:after{content:"";position:absolute;inset:25px;border:1px solid rgba(255,193,7,.07);border-radius:50%}.orb:after{inset:55px}.card{position:relative;width:min(420px,94vw);padding:34px 24px 28px;text-align:center;border:1px solid rgba(255,193,7,.32);border-radius:30px;background:linear-gradient(145deg,rgba(27,27,27,.97),rgba(7,7,7,.98));box-shadow:0 28px 80px rgba(0,0,0,.72),0 0 45px rgba(255,174,0,.07);overflow:hidden}.card:before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 25%,rgba(255,255,255,.055) 48%,transparent 65%);transform:translateX(-120%);animation:sweep 4.8s ease-in-out infinite;pointer-events:none}.logo{position:relative;width:112px;height:112px;border-radius:27px;object-fit:cover;box-shadow:0 14px 40px rgba(0,0,0,.62);animation:float 3s ease-in-out infinite}.ring{position:absolute;top:26px;left:50%;width:128px;height:128px;margin-left:-64px;border:1px solid rgba(255,193,7,.25);border-radius:34px;animation:pulse 2.8s ease-out infinite;pointer-events:none}h1{position:relative;font-size:27px;line-height:1.1;margin:21px 0 7px;font-weight:900}h1 span{color:#ffc107}.message{position:relative;margin:0;color:#aaa;font-size:14px;line-height:1.55}.badge{display:inline-flex;align-items:center;gap:8px;margin-top:24px;padding:8px 14px;border:1px solid rgba(255,193,7,.34);border-radius:999px;color:#ffd54f;background:rgba(255,193,7,.07);font-size:10px;font-weight:900;letter-spacing:1px;text-transform:uppercase}.loader{position:relative;height:4px;margin:27px auto 0;width:170px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden}.loader i{display:block;width:55%;height:100%;border-radius:99px;background:linear-gradient(90deg,transparent,#ffc107,#fff0a8,#ffc107,transparent);animation:load 1.7s ease-in-out infinite}.status{position:relative;margin-top:13px;color:#777;font-size:11px;min-height:16px}.install{display:none;width:100%;margin-top:20px;border:0;border-radius:15px;padding:15px;background:linear-gradient(180deg,#ffd32a,#ed9f00);color:#171000;font-size:15px;font-weight:900;cursor:pointer;box-shadow:0 12px 30px rgba(230,150,0,.22)}.install.show{display:block}.install:disabled{opacity:.65}.manual{display:none;margin-top:10px;color:#777;font-size:10px;line-height:1.5}.manual.show{display:block}.route{position:relative;margin-top:15px;color:#3f3f3f;font-size:9px}.loading{display:none}.loading.show{display:grid;place-items:center}.spinner{width:36px;height:36px;border:3px solid rgba(255,255,255,.12);border-top-color:#ffc107;border-radius:50%;animation:spin .7s linear infinite;margin:auto}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes pulse{0%{transform:scale(.86);opacity:0}35%{opacity:.7}100%{transform:scale(1.12);opacity:0}}@keyframes sweep{0%,15%{transform:translateX(-120%)}48%,100%{transform:translateX(120%)}}@keyframes load{0%{transform:translateX(-130%)}100%{transform:translateX(310%)}}@keyframes orb{0%,100%{transform:scale(.95);opacity:.35}50%{transform:scale(1.08);opacity:.65}}@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="bg"></div><div class="orb"></div>
<main class="card" id="gate">
  <div class="ring"></div>
  <img class="logo" src="./icone.png" alt="O Rei da Coxinha">
  <h1>O Rei da <span>Coxinha</span></h1>
  <p class="message">Uma nova versão do aplicativo está chegando.</p>
  <div class="badge">✦ NOVA ATUALIZAÇÃO</div>
  <div class="loader"><i></i></div>
  <div class="status" id="status">Preparando o novo sistema...</div>
  <button class="install" id="install">Instalar aplicativo</button>
  <div class="manual" id="manual">Se o botão não aparecer, use o menu do navegador e escolha “Instalar aplicativo” ou “Adicionar à tela inicial”.</div>
  <div class="route" id="route"></div>
</main>
<main class="card loading" id="loading"><div><div class="spinner"></div><h1>Abrindo o <span>aplicativo...</span></h1></div></main>
<script>
(()=>{
'use strict';
const routes={'':'cardápio.html','cardapio':'cardápio.html','cardápio':'cardápio.html','itens':'itens.html','pix':'pix.html','jogos':'jogos.html'};
function routeKey(){let p=location.pathname.replace(/\/+$/,'');const base=location.origin+'/-/';if(p==='/-/'||p==='')return '';if(p.startsWith('/-/'))p=p.slice(3);else p=p.replace(/^\/+/, '');return p.replace(/\.html$/i,'').replace(/^\/+|\/+$/g,'').toLowerCase()}
const key=routeKey(),destination=routes[key]||routes[''];
const target=new URL('./'+destination,location.origin+'/-/');target.search=location.search;target.hash=location.hash;
document.getElementById('route').textContent='';
const gate=document.getElementById('gate'),loading=document.getElementById('loading'),btn=document.getElementById('install'),status=document.getElementById('status'),manual=document.getElementById('manual');let deferred=null,done=false;
function installed(){return matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches||navigator.standalone===true}
function go(){if(done)return;done=true;gate.style.display='none';loading.classList.add('show');location.replace(target.href)}
if(installed()){go();return}
if('serviceWorker' in navigator)navigator.serviceWorker.register('./SW-CLIENTE.js',{scope:'./'}).catch(()=>{});
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;btn.classList.add('show');btn.textContent='📲 Instalar aplicativo';status.textContent='Toque para continuar';});
btn.addEventListener('click',async()=>{if(!deferred){manual.classList.add('show');status.textContent='Instalação disponível pelo menu do navegador';return}btn.disabled=true;deferred.prompt();try{const r=await deferred.userChoice;if(r.outcome==='accepted'){status.textContent='Instalando...'}else{btn.disabled=false;status.textContent='A instalação é necessária para continuar'}}catch(e){btn.disabled=false}});
addEventListener('appinstalled',()=>{deferred=null;setTimeout(()=>{if(installed())go()},250)});
const watcher=setInterval(()=>{if(installed()){clearInterval(watcher);go()}},400);
setTimeout(()=>{if(!deferred&&!installed()){btn.classList.add('show');btn.textContent='📲 Instalar aplicativo';manual.classList.add('show');status.textContent='Instale pelo menu do navegador para continuar'}},2200);
})();
</script>
</body>
</html>
