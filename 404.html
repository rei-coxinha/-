<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Rei da Coxinha</title>
    <style>
        body { margin: 0; background: #0b1020; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .spinner { width: 38px; height: 38px; border: 4px solid rgba(255,255,255,.18); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="spinner"></div>
<script>
(function () {
    // O GitHub Pages cai aqui quando não encontra o arquivo.
    // Lemos o caminho e redirecionamos para o index.html com os parâmetros certos.

    var path = window.location.pathname; // ex: /-/96603348=malu  ou  /-/clear

    // Remove barra final
    path = path.replace(/\/+$/, '');

    // ── Comando: /-/clear ────────────────────────────────────────────
    if (path === '/-/clear') {
        window.location.replace('https://rei-coxinha.github.io/-/index.html?_cmd=clear');
        return;
    }

    // ── Comando: /-/NUMERO=NOME ──────────────────────────────────────
    var match = path.match(/^\/-\/(\d{8,})=(.+)$/);
    if (match) {
        var numero = match[1];
        var nome   = match[2];

        // Normaliza: "819" + últimos 8 dígitos
        var ultimos8 = numero.slice(-8);
        var phone    = '819' + ultimos8;

        window.location.replace(
            'https://rei-coxinha.github.io/-/index.html' +
            '?autoPhone=' + encodeURIComponent(phone) +
            '&autoName='  + encodeURIComponent(decodeURIComponent(nome))
        );
        return;
    }

    // ── Qualquer outra URL inválida → volta para o app ───────────────
    window.location.replace('https://rei-coxinha.github.io/-/');
})();
</script>
</body>
</html>
