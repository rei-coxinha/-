<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>O Rei da Coxinha</title></head>
<body style="margin:0;background:#0b1020;color:#fff;font-family:system-ui;min-height:100vh">
<script>
(async function(){
  const path=location.pathname.replace(/\/+$/,'');
  const isClear=/(?:^|\/)clear$/i.test(path);
  const last=path.split('/').filter(Boolean).pop()||'';
  const special=/^(\d{8,15})=(.+)$/.exec(last);
  if(!isClear && special){
    location.replace('./cardápio.html?auto='+encodeURIComponent(special[1]+'='+decodeURIComponent(special[2].replace(/\+/g,'%20'))));
    return;
  }
  if(!isClear){ location.replace('./'); return; }
  document.body.innerHTML='<main style="min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center"><div><div style="font-size:64px">🧹</div><h1>Limpando tudo...</h1><p style="opacity:.7">Aguarde um instante.</p></div></main>';
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(async r=>{try{if(r.active)r.active.postMessage({type:'CLEAR_ALL'});else if(r.waiting)r.waiting.postMessage({type:'CLEAR_ALL'});}catch(e){}}));
    }
    if('caches' in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)));}
    if('indexedDB' in window){await new Promise(resolve=>{try{const q=indexedDB.deleteDatabase('rei-coxinha-push');q.onsuccess=q.onerror=q.onblocked=resolve}catch(e){resolve()}})}
    try{localStorage.clear()}catch(e){} try{sessionStorage.clear()}catch(e){}
    try{document.cookie.split(';').forEach(c=>{const i=c.indexOf('=');const n=(i>=0?c.slice(0,i):c).trim();if(n)document.cookie=n+'=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/';})}catch(e){}
    if('serviceWorker' in navigator){const regs2=await navigator.serviceWorker.getRegistrations();await Promise.all(regs2.map(r=>r.unregister()));}
  }catch(e){}
  setTimeout(()=>location.replace('./'),1000);
})();
</script></body></html>
